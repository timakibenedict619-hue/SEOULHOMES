<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeoulHomes | Property Details</title>

    <link rel="stylesheet" href="agent.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
    </div>

    <!-- Header -->
    <header class="topbar">

        <button id="backBtn" class="icon-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <div class="top-actions">

            <button id="shareBtn" class="icon-btn">
                <i class="fa-solid fa-share-nodes"></i>
            </button>

            <button id="favoriteBtn" class="icon-btn">
                <i class="fa-regular fa-heart"></i>
            </button>

        </div>

    </header>

    <!-- Property Gallery -->
    <section class="gallery">

        <img id="mainImage" src="" alt="Property">

        <div class="image-count">
            <span id="currentImage">1</span> /
            <span id="totalImages">1</span>
        </div>

        <button class="gallery-btn left" id="prevImage">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <button class="gallery-btn right" id="nextImage">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </section>

    <!-- Property Information -->
    <main class="container">

        <section class="price-card">

            <span id="propertyType" class="property-type">
                Apartment
            </span>

            <h1 id="propertyPrice"></h1>

            <p id="propertyDeposit"></p>

            <h2 id="propertyTitle"></h2>

            <div class="property-meta">

                <div>
                    <i class="fa-solid fa-bed"></i>
                    <span id="beds"></span>
                </div>

                <div>
                    <i class="fa-solid fa-bath"></i>
                    <span id="baths"></span>
                </div>

                <div>
                    <i class="fa-solid fa-building"></i>
                    <span id="floor"></span>
                </div>

            </div>

        </section>

        <!-- Amenities -->
        <section class="card">

            <h3>Amenities</h3>

            <div class="amenities">

                <div><i class="fa-solid fa-wifi"></i> WiFi</div>

                <div><i class="fa-solid fa-car"></i> Parking</div>

                <div><i class="fa-solid fa-snowflake"></i> Air Conditioner</div>

                <div><i class="fa-solid fa-elevator"></i> Elevator</div>

                <div><i class="fa-solid fa-shield-halved"></i> Security</div>

                <div><i class="fa-solid fa-paw"></i> Pet Friendly</div>

                <div><i class="fa-solid fa-tv"></i> Smart TV</div>

                <div><i class="fa-solid fa-kitchen-set"></i> Kitchen</div>

            </div>

        </section>

        <!-- Description -->
        <section class="card">

            <h3>Description</h3>

            <p id="propertyDescription">
                Loading...
            </p>

        </section>

        <!-- Realtor -->
        <section class="card">

            <h3>Realtor</h3>

            <div class="agent">

                <img id="agentPhoto"
                     src="https://i.pravatar.cc/200"
                     alt="Agent">

                <div class="agent-info">

                    <h4 id="agentName"></h4>

                    <p id="agentAgency"></p>

                    <span class="verified">
                        ✔ Verified Realtor
                    </span>

                </div>

            </div>

        </section>

        <!-- Map -->
        <section class="card">

            <h3>Location</h3>

            <div class="map">

                <iframe
                    id="mapFrame"
                    loading="lazy"
                    allowfullscreen>
                </iframe>

            </div>

        </section>

        <!-- Contact -->
        <section class="card">

            <h3>Contact Realtor</h3>

            <div class="contact-buttons">

                <button id="whatsappBtn">
    <i class="fa-brands fa-whatsapp"></i>
    WhatsApp
</button>

<button id="emailBtn">
    <i class="fa-solid fa-envelope"></i>
    Email
</button>

<button id="telegramBtn">
    <i class="fa-brands fa-telegram"></i>
    Telegram
</button>

            </div>

        </section>

        <!-- Similar Properties -->
        <section>

            <h3 class="section-title">
                Similar Properties
            </h3>

            <div id="similarProperties"
                 class="similar-grid">
            </div>

        </section>

    </main>

    <!-- Sticky Bottom Bar -->
    <div class="bottom-bar">

        <button id="saveProperty">
            <i class="fa-regular fa-heart"></i>
            Save
        </button>

        <button id="bookViewing">
            <i class="fa-solid fa-calendar-days"></i>
            Book Viewing
        </button>

    </div>

    <script type="module" src="agent.js"></script>

</body>
</html>
