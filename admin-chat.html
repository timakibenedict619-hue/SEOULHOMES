<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Chat • SeoulHomes</title>

<link rel="stylesheet" href="admin-chat.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Header -->

<header class="chat-header">

<button id="backBtn" class="icon-btn">

<i class="fa-solid fa-arrow-left"></i>

</button>

<div class="agent-profile">

<img
id="customerAvatar"
src="https://i.pravatar.cc/200"
alt="Customer">

<div>

<h3 id="customerName">

Customer

</h3>

<p id="customerStatus">

🟢 Online

</p>

</div>

</div>

<button id="refreshBtn" class="icon-btn">

<i class="fa-solid fa-rotate"></i>

</button>

</header>

<!-- Messages -->

<main
class="chat-container"
id="chatContainer">

<div class="chat-date">

Today

</div>

</main>

<!-- Typing -->

<div
id="typingIndicator"
class="typing"
style="display:none;">

<span></span>

<span></span>

<span></span>

</div>

<!-- Input -->

<footer class="chat-input">

<button id="attachBtn">

<i class="fa-solid fa-paperclip"></i>

</button>

<input
type="text"
id="messageInput"
placeholder="Reply to customer...">

<button id="emojiBtn">

😊

</button>

<button id="sendBtn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</footer>

<script type="module" src="admin-chat.js"></script>

</body>

</html>
